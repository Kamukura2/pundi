<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pundi Admin</title><link rel="icon" href="/icons/icon.svg"><style>
:root{font-family:Inter,system-ui,sans-serif;color:#132138;background:#f4f7fb;--surface:#fff;--line:#dce4ef;--muted:#6f7d93;--accent:#7f66ff;--good:#159a69;--bad:#c33b54}*{box-sizing:border-box}body{margin:0}main{max-width:1320px;margin:auto;padding:28px 22px 60px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.14em}.head h1{margin:5px 0 0;font-size:30px}.head p{margin:5px 0;color:var(--muted)}button,input,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:inherit}button{cursor:pointer;font-weight:700}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(26,45,75,.06)}.card small{color:var(--muted);display:block}.card strong{font-size:27px;display:block;margin-top:7px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}.toolbar input{min-width:260px;flex:1}.table-wrap{overflow:auto}.users{width:100%;border-collapse:collapse}.users th,.users td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}.users th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf0ff;color:#5644bb;font-weight:800;font-size:11px}.manual{color:#9b5a00;background:#fff2d2}.ok{color:var(--good)}.error{color:var(--bad);margin:12px 0}.meta{font-size:12px;color:var(--muted);margin-top:10px}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.drawer{position:fixed;inset:0;background:rgba(8,15,30,.5);display:grid;place-items:center;padding:20px}.drawer[hidden]{display:none}.detail{max-width:650px;width:100%;max-height:90vh;overflow:auto}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-grid div{padding:11px;background:#f6f8fc;border-radius:10px}.detail-grid small{display:block;color:var(--muted)}.feature{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:10px 0}.notice{padding:14px;border-radius:12px;background:#fff2d2;color:#714900;margin-bottom:18px;font-size:13px}@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){main{padding:18px 12px}.cards{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;flex-direction:column}.head h1{font-size:25px}.detail-grid{grid-template-columns:1fr}}
.feedback-panel{margin-top:18px}.feedback-panel h2{margin:4px 0 0;font-size:22px}.feedback-list{display:grid;gap:12px}.feedback-item{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fbfcff}.feedback-meta{display:flex;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:12px}.feedback-meta b{color:var(--accent);font-size:13px}.feedback-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;margin:12px 0}.feedback-edit{display:grid;grid-template-columns:150px 120px 1fr auto;gap:8px}.feedback-edit input{min-width:0}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.feedback-edit{grid-template-columns:1fr 1fr}.feedback-edit input,.feedback-edit button{grid-column:span 2}}
</style></head>
<body><main>
<header class="head"><div><div class="eyebrow">PUNDI OWNER CONSOLE</div><h1>Admin Dashboard</h1><p>Product metadata only. Private financial contents are never shown.</p></div><button id="signOut">Sign out</button></header>
<div id="notice" class="notice">Loading authenticated admin session…</div>
<section id="dashboard" hidden><div id="cards" class="cards"></div><section id="acquisitionPanel" class="panel acquisition-panel" hidden><div class="eyebrow">GROWTH</div><h2>Acquisition</h2><div id="acquisitionMetrics" class="cards"></div><div id="acquisitionBreakdown" class="meta"></div></section><div class="panel"><div class="toolbar"><input id="search" placeholder="Search email or user ID"><select id="plan"><option value="">All plans</option><option value="free">Free</option><option value="paid">Paid</option></select><select id="status"><option value="">All statuses</option><option>free</option><option>trialing</option><option>active</option><option>past_due</option><option>cancelled</option><option>expired</option></select><select id="sort"><option value="newest">Newest</option><option value="oldest">Oldest</option></select><button id="refresh">Refresh metadata</button></div><div id="error" class="error"></div><div class="table-wrap"><table class="users"><thead><tr><th>Email</th><th>User ID</th><th>Created</th><th>Last active</th><th>Plan</th><th>Status</th><th>Feature access</th><th>Account</th><th>Actions</th></tr></thead><tbody id="userRows"></tbody></table></div><div class="pager"><span id="count" class="meta"></span><div><button id="prev">Previous</button> <button id="next">Next</button></div></div></div><section class="panel feedback-panel"><div class="toolbar"><div><div class="eyebrow">CONTROLLED BETA</div><h2>Beta Feedback</h2></div><input id="feedbackSearch" placeholder="Search feedback"><select id="feedbackStatus"><option value="">All statuses</option><option>New</option><option>Reviewing</option><option>Planned</option><option>Resolved</option><option>Closed</option></select><select id="feedbackCategory"><option value="">All categories</option><option>Bug</option><option>Feature request</option><option>Usability</option><option>Data / calculation issue</option><option>Other</option></select></div><div id="feedbackMetrics" class="meta"></div><div id="feedbackRows" class="feedback-list"></div></section></section>
</main><div id="drawer" class="drawer" hidden><section class="panel detail"><div class="head"><div><div class="eyebrow">ACCOUNT METADATA</div><h2 id="detailTitle">User</h2></div><button id="close">Close</button></div><div id="detailBody"></div></section></div>
<script type="module" src="./admin.js"></script></body></html>
